<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Adventure Capitalist Offline Launcher</title>
    <style>
        /* Forces the game to fill the entire window offline */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000;
        }
        iframe {
            width: 100%; height: 100%; border: none;
        }
        /* Style for the floating transfer panel themed to green/gold */
        #saveMenu {
            position: fixed; bottom: 10px; right: 10px; z-index: 99999;
            background: rgba(18, 53, 36, 0.95); padding: 8px; border-radius: 6px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5); font-family: sans-serif;
            border: 1px solid #d4af37;
        }
        #saveMenu button {
            background: #d4af37; color: #123524; border: none; padding: 6px 12px;
            cursor: pointer; font-size: 12px; font-weight: bold; border-radius: 4px; margin-left: 5px;
        }
        #saveMenu button:hover { background: #f3cf55; }
    </style>
</head>
<body>

    <!-- Target the exact name of your Adventure Capitalist HTML file here -->
    <iframe id="gameFrame" src="adventure-capitalist.html"></iframe>

    <!-- Floating Save/Load Overlay -->
    <div id="saveMenu">
        <button id="exportSave">💰 Export Save</button>
        <button id="importSave">💼 Import Save</button>
        <input type="file" id="filePicker" style="display: none;" accept=".json">
    </div>

    <script>
        const iframe = document.getElementById('gameFrame');

        // === EXPORT FEATURE ===
        document.getElementById('exportSave').addEventListener('click', () => {
            try {
                // Targets the inside of the iframe to get your active game numbers
                const frameStorage = iframe.contentWindow.localStorage;
                const allData = JSON.stringify(frameStorage);
                
                if (allData === '{}' || Object.keys(frameStorage).length === 0) {
                    alert('No business progress found inside the game frame to export! Buy a business first.');
                    return;
                }

                const blob = new Blob([allData], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                
                a.href = url;
                a.download = 'adventure_capitalist_save.json';
                document.body.appendChild(a);
                a.click();
                
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (err) {
                alert('Security Block: Open this index file using a local web server (like VS Code Live Server) so the frame can safely share data.');
            }
        });

        // === IMPORT FEATURE ===
        const filePicker = document.getElementById('filePicker');
        
        document.getElementById('importSave').addEventListener('click', () => {
            filePicker.click();
        });

        filePicker.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const backup = JSON.parse(evt.target.result);
                    const targetWindow = iframe.contentWindow;
                    
                    // Clear the frame's data cache completely 
                    targetWindow.localStorage.clear();
                    
                    // Repopulate with your imported backup values
                    for (const key in backup) {
                        targetWindow.localStorage.setItem(key, backup[key]);
                    }
                    
                    alert('Save loaded! Destroying active game loop variables...');
                    
                    // BREAKS THE RAM LOOP: Force drops the iframe to blank before refreshing to make the numbers stick
                    const gameUrl = iframe.src;
                    iframe.src = 'about:blank';
                    setTimeout(() => {
                        iframe.src = gameUrl;
                    }, 50);

                } catch (err) {
                    alert('Error: This file is not a valid save package configuration.');
                }
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
