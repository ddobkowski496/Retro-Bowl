<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Retro Bowl Offline Launcher</title>
    <style>
        /* Forces the game to fill the entire window offline */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000;
        }
        iframe {
            width: 100%; height: 100%; border: none;
        }
        /* Style for the floating transfer panel */
        #saveMenu {
            position: fixed; bottom: 10px; right: 10px; z-index: 99999;
            background: rgba(0, 0, 0, 0.85); padding: 8px; border-radius: 6px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5); font-family: sans-serif;
        }
        #saveMenu button {
            background: #222; color: #fff; border: 1px solid #555; padding: 6px 12px;
            cursor: pointer; font-size: 12px; font-weight: bold; border-radius: 4px; margin-left: 5px;
        }
        #saveMenu button:hover { background: #444; }
    </style>
</head>
<body>

    <!-- Target iframe with an ID for data syncing -->
    <iframe id="gameFrame" src="retro-bowl.html"></iframe>

    <!-- Floating Save/Load Overlay -->
    <div id="saveMenu">
        <button id="exportSave">⬇️ Export Save</button>
        <button id="importSave">⬆️ Import Save</button>
        <button id="cleanSaves" style="color: #ff4d4d; border-color: #883333;">🧹 Clean Dupes</button>
        <input type="file" id="filePicker" style="display: none;" accept=".json">
    </div>

    <script>
        // === STORAGE CLEANER FUNCTION ===
        // Keeps only the most recent core game slots and wipes dynamic temp junk
        function runStorageCleanup() {
            const keysToKeep = ['RetroBowl.0', 'RetroBowl.1', 'RetroBowl.2', 'RetroBowl.3', 'RetroBowl.settings'];
            let removedCount = 0;

            for (let i = localStorage.length - 1; i >= 0; i--) {
                const key = localStorage.key(i);
                // If it isn't one of the core 4 save slots or settings, destroy it
                if (!keysToKeep.some(keepKey => key.startsWith(keepKey))) {
                    localStorage.removeItem(key);
                    removedCount++;
                }
            }
            return removedCount;
        }

        // Run cleanup automatically on boot to prevent file expansion
        runStorageCleanup();

        // === EXPORT FEATURE ===
        document.getElementById('exportSave').addEventListener('click', () => {
            // First run a quick cleanup so the exported file is small and singular
            runStorageCleanup();

            const allData = JSON.stringify(localStorage);
            
            if (allData === '{}' || localStorage.length === 0) {
                alert('No save data found to export! Play a game first.');
                return;
            }

            const blob = new Blob([allData], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            
            a.href = url;
            a.download = 'retro_bowl_single_save.json';
            document.body.appendChild(a);
            a.click();
            
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // === IMPORT FEATURE ===
        const filePicker = document.getElementById('filePicker');
        
        document.getElementById('importSave').addEventListener('click', () => {
            filePicker.click();
        });

        filePicker.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const backup = JSON.parse(evt.target.result);
                    
                    // Nuke everything first to ensure a fresh slate
                    localStorage.clear();
                    
                    // Repopulate using only structural game tags
                    const keysToKeep = ['RetroBowl.0', 'RetroBowl.1', 'RetroBowl.2', 'RetroBowl.3', 'RetroBowl.settings'];
                    for (const key in backup) {
                        if (keysToKeep.some(keepKey => key.startsWith(keepKey))) {
                            localStorage.setItem(key, backup[key]);
                        }
                    }
                    
                    alert('Save loaded cleanly! Reloading game...');
                    window.location.reload();
                } catch (err) {
                    alert('Error: This file is not a valid Retro Bowl save package.');
                }
            };
            reader.readAsText(file);
        });

        // === MANUAL CLEAN BUTTON ===
        document.getElementById('cleanSaves').addEventListener('click', () => {
            const cleaned = runStorageCleanup();
            alert(`Cleanup complete! Deleted ${cleaned} redundant save variants.`);
            document.getElementById('gameFrame').contentWindow.location.reload();
        });
    </script>
</body>
</html>
